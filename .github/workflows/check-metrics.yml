# Repository hygiene, per PRD § P7: "No personal metrics in git history, ever."
#
# Runs scripts/check-no-metrics.sh on every push and pull request. The script is
# the specification; this file only arranges for it to run somewhere a human
# will see the result.
name: check-metrics

on:
  push:
    branches: [main]
  pull_request:

# The scan reads git history and nothing else. No database, no secrets, and
# nothing it prints is unredacted — findings are masked by default precisely
# because logs on a public repository are themselves public.
permissions:
  contents: read

jobs:
  check-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # REQUIRED. The default is depth 1, and a shallow clone has no history
          # to scan. The script detects this and fails rather than reporting a
          # clean history it never read — so without this line the job does not
          # silently pass, it simply cannot run.
          fetch-depth: 0

      - name: Scan tree, history and published refs
        run: |
          set +e
          ./scripts/check-no-metrics.sh
          status=$?
          set -e
          case "$status" in
            # Includes the pre-2026-08-19 values GitHub still serves from
            # refs/pull/*: known, accepted, and compared against the baseline
            # in the script rather than waved through. Anything beyond that set
            # is a finding and lands in the catch-all below.
            0) echo "::notice::clean" ;;
            # The residue has SHRUNK — the host serves less than the baseline
            # allows for. Nothing new is exposed, so this must not fail the
            # build; it asks for the baseline to be re-cut so the check keeps
            # its grip. See the script's ACCEPTED_PUBLISHED_VALUES.
            3) echo "::warning::the accepted published-refs baseline is now wider than the host — re-cut it with 'npm run check:metrics -- --print-baseline'" ;;
            *) exit "$status" ;;
          esac
